<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio motion studio</title><style>
@font-face{font-family:StudioMono;src:url('/fonts/ibm-plex-mono-400.woff2')}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03080d;color:#edf2e9}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}.studio-controls{position:absolute;bottom:10px;left:15px;right:15px;background:#0f201af2;z-index:10;display:flex;align-items:center;gap:12px;padding:10px;border:1px solid #46623f;font:12px StudioMono}.studio-controls input{flex:1}.studio-controls button{background:#c5f58a;color:#091509;border:0;padding:7px 12px;font:12px StudioMono;cursor:pointer}.capture .studio-controls{display:none}
